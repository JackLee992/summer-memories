# Gradle 属性模板（按需手动安装；tools/build_android.sh 不会自动部署）。
# 代理仅在镜像缺失、需要回源 Maven Central / Google 时使用；阿里云镜像直连、不经代理。
# 若本机代理端口不是 7897，请相应修改或删除 http(s).proxyHost 段（有镜像时通常无需代理）。
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=7897
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=7897
systemProp.http.nonProxyHosts=localhost|127.0.0.1|*.aliyun.com|maven.aliyun.com
systemProp.https.nonProxyHosts=localhost|127.0.0.1|*.aliyun.com|maven.aliyun.com
